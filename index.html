<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>EV Route Viewer</title>

    <style>
      body {
        margin: 0;
        font-family: Arial;
        background: #0f172a;
        color: white;
      }

      /* ---------- TOP BAR ---------- */
      .status-bar {
        height: 60px;
        background: #111827;
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 0 10px;
      }

      .badge {
        background: #1f2937;
        padding: 6px 14px;
        border-radius: 8px;
        font-size: 14px;
        min-width: 150px;
        text-align: center;
        white-space: nowrap;
      }

      /* ---------- SEARCH (BADGE STYLE) ---------- */
      .search-badge {
        background: #1f2937;
        padding: 4px 10px;
        border-radius: 8px;
        min-width: 150px;
      }

      .search-badge input {
        width: 100%;
        background: transparent;
        border: none;
        outline: none;
        color: white;
        font-size: 14px;
      }

      /* ---------- MAP ---------- */
      #map {
        height: calc(100vh - 60px);
        width: 100%;
      }
    </style>
  </head>

  <body>
    <div class="status-bar">
      <div class="badge">📍 <span id="sourceName">Detecting…</span></div>
      <div class="badge">🎯 <span id="destName">--</span></div>
      <div class="badge">🌤 <span id="weather">--</span></div>
      <div class="badge">
        🔋 <span id="battery">--%</span>
        <input
          id="batteryInput"
          type="number"
          min="1"
          max="100"
          step="1"
          style="
            width: 60px;
            margin-left: 6px;
            background: transparent;
            border: none;
            outline: none;
            color: white;
          "
          placeholder="%"
          title="Battery %"
        />
      </div>

      <!-- SOURCE SEARCH -->
      <div class="search-badge">
        📍
        <input id="sourceInput" type="text" placeholder="Source (optional)" />
      </div>

      <!-- DESTINATION SEARCH -->
      <div class="search-badge">
        🎯
        <input id="searchInput" type="text" placeholder="Destination" />
      </div>
      <!-- DWPT ROAD INPUT -->
      <div class="search-badge" title="Dynamic Wireless Charging road km along your route">
        ⚡
        <input
          id="dwptInput"
          type="number"
          min="0"
          step="1"
          style="width: 55px; background: transparent; border: none; outline: none; color: white; font-size: 14px;"
          placeholder="DWPT km"
        />
      </div>
      <div class="badge" style="cursor: pointer" id="goButton">Go</div>
    </div>

    <div id="map"></div>

    <!-- Google Maps (map only) -->
    <script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyB5MI6BAOHfPVSBfeptIQiPZaBBUHMjMO4"></script>

    <script>
      let map;
      let userMarker = null;
      let destMarker = null;
      let routePolyline = null;
      let dwptPolylines = [];   // red DWPT road overlays
      let chargerMarkers = [];
      let sourceCoord = null;
      let destCoord = null;
      let weatherSnapshot = null;
      let batteryLevel = 0.8;
      let sourceNameText = null;
      let destNameText = null;
      let carMarker = null;
      let animationTimer = null;
      let sourceFromClick = false;
      let hoverInfo = null;
      let destinationSummaryInfo = null;

      /* ---------------------
   INIT MAP
---------------------*/
      function initMap() {
        map = new google.maps.Map(document.getElementById("map"), {
          center: { lat: 20.5937, lng: 78.9629 },
          zoom: 6,
        });

        map.addListener("click", (e) => {
          const sourceInput = document.getElementById("sourceInput");
          const focusIsSource =
            sourceInput && document.activeElement === sourceInput;
          if (focusIsSource || !sourceCoord) {
            setSource(e.latLng.lat(), e.latLng.lng(), true);
          } else {
            setDestination(e.latLng.lat(), e.latLng.lng());
          }
        });

        initSearch();
        initBatteryInput();
        detectSource();
        getBattery();
        loadRouteJson();
        initGoButton();
      }

      /* ---------------------
   SEARCH (TEXT → LAT/LNG)
---------------------*/
      function initSearch() {
        const input = document.getElementById("searchInput");
        const sourceInput = document.getElementById("sourceInput");

        input.addEventListener("keydown", async (e) => {
          if (e.key !== "Enter") return;

          const query = input.value.trim();
          if (!query) return;

          const result = await searchPlace(query);
          if (!result) return alert("Location not found");

          const lat = parseFloat(result.lat);
          const lng = parseFloat(result.lon);

          setDestination(lat, lng);
          map.setCenter({ lat, lng });
          map.setZoom(14);
        });

        if (sourceInput) {
          sourceInput.addEventListener("keydown", async (e) => {
            if (e.key !== "Enter") return;

            const query = sourceInput.value.trim();
            if (!query) return;

            const result = await searchPlace(query);
            if (!result) return alert("Location not found");

            const lat = parseFloat(result.lat);
            const lng = parseFloat(result.lon);

            setSource(lat, lng);
            map.setCenter({ lat, lng });
            map.setZoom(14);
          });
        }
      }

      function initGoButton() {
        const btn = document.getElementById("goButton");
        if (!btn) return;
        btn.addEventListener("click", () => {
          clearRoute();
          planRoute();
        });
      }

      /* ---------------------
   OPENSTREETMAP SEARCH
---------------------*/
      async function searchPlace(query) {
        const url = `https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(query)}`;

        const res = await fetch(url, {
          headers: { "User-Agent": "EV-Route-Viewer" },
        });

        const data = await res.json();
        return data[0];
      }

      /* ---------------------
   REVERSE GEOCODE (NAME)
---------------------*/
      async function getPlaceName(lat, lng) {
        const url = `https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lng}`;

        const res = await fetch(url, {
          headers: { "User-Agent": "EV-Route-Viewer" },
        });

        const data = await res.json();

        return (
          data.address.city ||
          data.address.town ||
          data.address.village ||
          data.address.county ||
          data.address.state ||
          "Unknown"
        );
      }

      /* ---------------------
   SOURCE (GPS)
---------------------*/
      function detectSource() {
        if (!navigator.geolocation) {
          document.getElementById("sourceName").innerText = "Unavailable";
          return;
        }

        navigator.geolocation.getCurrentPosition(async (pos) => {
          const lat = pos.coords.latitude;
          const lng = pos.coords.longitude;
          sourceCoord = { lat, lng };

          userMarker = new google.maps.Marker({
            position: { lat, lng },
            map,
            icon: "http://maps.google.com/mapfiles/ms/icons/blue-dot.png",
            label: {
              text: "S",
              color: "#0f172a",
              fontWeight: "700",
            },
          });

          map.setCenter({ lat, lng });
          map.setZoom(14);

          const place = await getPlaceName(lat, lng);
          sourceNameText = place;
          document.getElementById("sourceName").innerText = place;
        });
      }

      async function setSource(lat, lng, fromClick = false) {
        sourceCoord = { lat, lng };
        sourceFromClick = !!fromClick;
        if (userMarker) {
          userMarker.setMap(null);
        }
        userMarker = new google.maps.Marker({
          position: { lat, lng },
          map,
          icon: fromClick
            ? "http://maps.google.com/mapfiles/ms/icons/yellow-dot.png"
            : "http://maps.google.com/mapfiles/ms/icons/blue-dot.png",
          label: {
            text: "S",
            color: "#0f172a",
            fontWeight: "700",
          },
        });
        const place = await getPlaceName(lat, lng);
        sourceNameText = place;
        document.getElementById("sourceName").innerText = place;
      }

      /* ---------------------
   DESTINATION
---------------------*/
      async function setDestination(lat, lng) {
        if (destMarker) {
          destMarker.setMap(null);
        }

        destMarker = new google.maps.Marker({
          position: { lat, lng },
          map,
          icon: "http://maps.google.com/mapfiles/ms/icons/red-dot.png",
        });
        destCoord = { lat, lng };

        const place = await getPlaceName(lat, lng);
        destNameText = place;
        document.getElementById("destName").innerText = place;

        getWeather(lat, lng);
      }

      /* ---------------------
   ROUTE JSON (BACKEND OUTPUT)
---------------------*/
      async function loadRouteJson() {
        try {
          const res = await fetch("route_output.json", { cache: "no-store" });
          if (!res.ok) return;
          const data = await res.json();
          renderRouteFromJson(data);
        } catch (e) {
          console.warn("route_output.json not found or blocked.", e);
        }
      }

      function clearRoute() {
        if (routePolyline) {
          routePolyline.setMap(null);
          routePolyline = null;
        }
        dwptPolylines.forEach((p) => p.setMap(null));
        dwptPolylines = [];
        chargerMarkers.forEach((m) => m.setMap(null));
        chargerMarkers = [];
        if (carMarker) {
          carMarker.setMap(null);
          carMarker = null;
        }
        if (animationTimer) {
          clearTimeout(animationTimer);
          animationTimer = null;
        }
        if (hoverInfo) {
          hoverInfo.close();
          hoverInfo = null;
        }
        if (destinationSummaryInfo) {
          destinationSummaryInfo.close();
          destinationSummaryInfo = null;
        }
      }

      function renderRouteFromJson(data) {
        if (!data || !data.route_coords || data.route_coords.length === 0)
          return;

        clearRoute();

        const path = data.route_coords.map(([lat, lon]) => ({ lat, lng: lon }));

        routePolyline = new google.maps.Polyline({
          path,
          geodesic: true,
          strokeColor: "#22c55e",
          strokeOpacity: 0.9,
          strokeWeight: 4,
        });
        routePolyline.setMap(map);

        // --- DWPT road segments (red overlay) ---
        if (Array.isArray(data.dwpt_road_coords) && data.dwpt_road_coords.length > 0) {
          data.dwpt_road_coords.forEach((segment, idx) => {
            if (!Array.isArray(segment) || segment.length < 2) return;
            const segPath = segment.map(([lat, lon]) => ({ lat, lng: lon }));
            const poly = new google.maps.Polyline({
              path: segPath,
              geodesic: true,
              strokeColor: "#ef4444",   // Tailwind red-500
              strokeOpacity: 1.0,
              strokeWeight: 6,
              zIndex: 10,               // draw on top of green route
            });
            poly.setMap(map);

            // InfoWindow on click: show which chunk this is + kWh rate
            const info = new google.maps.InfoWindow({
              content: `<div style="color:#111827;font-family:Arial;">
                          <strong>⚡ DWPT Road Segment ${idx + 1}</strong><br/>
                          Wireless charging active<br/>
                          Rate: 20 kW @ 40 km/h<br/>
                          ≈ 0.5 kWh gained per km
                        </div>`,
            });
            poly.addListener("click", (e) => {
              info.setPosition(e.latLng);
              info.open({ map });
            });

            dwptPolylines.push(poly);
          });
        }

        const bounds = new google.maps.LatLngBounds();
        path.forEach((p) => bounds.extend(p));
        map.fitBounds(bounds);

        if (Array.isArray(data.actions)) {
          const batteryKwh = Number(
            data && data.meta && data.meta.battery_kwh
              ? data.meta.battery_kwh
              : 60,
          );
          data.actions.forEach((action) => {
            if (action[0] !== "CHARGE") return;
            const coord = action[4];
            if (!coord || coord.length !== 2) return;
            const [lat, lon] = coord;
            const addedKwh = Number(action[2] || 0);
            const chargeMin = Number(action[3] || 0);
            const addedPct =
              batteryKwh > 0 ? (addedKwh / batteryKwh) * 100 : null;
            const marker = new google.maps.Marker({
              position: { lat, lng: lon },
              map,
              icon: "http://maps.google.com/mapfiles/ms/icons/green-dot.png",
              title: `Predicted charging time: ${chargeMin.toFixed(1)} min`,
              label: {
                text: `${chargeMin.toFixed(0)} min`,
                color: "#0f172a",
                fontWeight: "700",
              },
            });
            const chargeDetails =
              addedPct === null || Number.isNaN(addedPct)
                ? `Charge added: ${addedKwh.toFixed(1)} kWh`
                : `Charge added: ${addedKwh.toFixed(1)} kWh (${addedPct.toFixed(1)}%)`;
            const info = new google.maps.InfoWindow({
              content: `<div style="color:#111827;font-family:Arial;"><strong>Charging stop</strong><br/>Predicted charging time: ${chargeMin.toFixed(1)} min<br/>${chargeDetails}</div>`,
            });
            marker.addListener("click", () =>
              info.open({ anchor: marker, map }),
            );
            chargerMarkers.push(marker);
          });
        }

        animateRoute(data, path);
        attachRouteHover(data, path);
        renderDestinationSummary(data, path);
      }

      /* ---------------------
   WEATHER
---------------------*/
      async function getWeather(lat, lng) {
        const KEY = "c11a9adde900018627cd9c85dd2c4d22";

        const res = await fetch(
          `https://api.openweathermap.org/data/2.5/weather?lat=${lat}&lon=${lng}&units=metric&appid=${KEY}`,
        );
        const w = await res.json();

        document.getElementById("weather").innerText =
          `${w.main.temp}°C ${w.weather[0].main}`;
        weatherSnapshot = {
          temp_c: w.main.temp,
          wind_kmh: w.wind && w.wind.speed ? w.wind.speed * 3.6 : null,
        };
      }

      /* ---------------------
   BATTERY
---------------------*/
      async function getBattery() {
        if (navigator.getBattery) {
          const b = await navigator.getBattery();
          batteryLevel = b.level;
          document.getElementById("battery").innerText =
            Math.round(b.level * 100) + "%";
          const input = document.getElementById("batteryInput");
          if (input && !input.value) {
            input.value = Math.round(b.level * 100);
          }
        } else {
          batteryLevel = 0.8;
          document.getElementById("battery").innerText = "80%";
          const input = document.getElementById("batteryInput");
          if (input && !input.value) {
            input.value = 80;
          }
        }
      }

      /* ---------------------
   ROUTE ANIMATION
---------------------*/
      function animateRoute(data, path) {
        if (!path || path.length === 0) return;

        if (!carMarker) {
          carMarker = new google.maps.Marker({
            position: path[0],
            map,
            icon: "http://maps.google.com/mapfiles/ms/icons/blue-dot.png",
            title: "EV",
          });
        } else {
          carMarker.setPosition(path[0]);
        }

        let i = 0;
        const stepMs = 50;

        function tick() {
          if (i >= path.length) {
            animationTimer = null;
            return;
          }
          carMarker.setPosition(path[i]);
          i += 1;
          animationTimer = setTimeout(tick, stepMs);
        }

        tick();
      }

      function attachRouteHover(data, path) {
        if (!routePolyline) return;
        const socs = Array.isArray(data.route_soc) ? data.route_soc : [];
        if (socs.length === 0) return;

        if (!hoverInfo) {
          hoverInfo = new google.maps.InfoWindow();
        }

        routePolyline.addListener("mousemove", (e) => {
          const lat = e.latLng.lat();
          const lng = e.latLng.lng();
          let best = Infinity;
          let idx = 0;
          for (let i = 0; i < path.length; i++) {
            const dLat = path[i].lat - lat;
            const dLng = path[i].lng - lng;
            const d = dLat * dLat + dLng * dLng;
            if (d < best) {
              best = d;
              idx = i;
            }
          }
          const socIdx =
            socs.length === path.length
              ? idx
              : Math.round(
                  (idx * (socs.length - 1)) / Math.max(path.length - 1, 1),
                );
          const raw = parseFloat(socs[socIdx]);
          const pct = Number.isFinite(raw) ? Math.round(raw * 100) : null;
          const text =
            pct === null || Number.isNaN(pct)
              ? "Predicted battery: --%"
              : `Predicted battery: ${pct}%`;
          hoverInfo.setContent(
            `<div style="color:#111827;font-family:Arial;">${text}</div>`,
          );
          hoverInfo.setPosition(path[idx]);
          hoverInfo.open({ map });
        });
        routePolyline.addListener("mouseout", () => {
          if (hoverInfo) {
            hoverInfo.close();
          }
        });
      }

      function renderDestinationSummary(data, path) {
        const meta = data && data.meta ? data.meta : {};
        const dwptKm = Number(meta.dwpt_km || 0);
        if (dwptKm <= 0 || !path || path.length === 0) return;

        const savedMin = Number(meta.dwpt_time_saved_min || 0);
        const enabledRoute = !!meta.dwpt_enabled_route;
        const dwptUsedKm = Number(meta.dwpt_km_used || 0);
        const withChargeMin = Number(meta.charge_time_with_dwpt_min || 0);
        const withoutChargeMin = Number(meta.charge_time_without_dwpt_min || 0);
        const withChargePct = Number(meta.charge_added_pct_with_dwpt || 0);
        const withoutChargePct = Number(meta.charge_added_pct_without_dwpt || 0);
        let content = "";

        if (enabledRoute) {
          content =
            `<div style="color:#111827;font-family:Arial;"><strong>DWPT impact</strong><br/>Dynamic charging made this route feasible.<br/>DWPT used on route: ${dwptUsedKm.toFixed(1)} km<br/>Predicted station charging time: ${withChargeMin.toFixed(1)} min (${withChargePct.toFixed(1)}%)</div>`;
        } else {
          content =
            `<div style="color:#111827;font-family:Arial;"><strong>DWPT impact</strong><br/>Without DWPT: predicted station charging time ${withoutChargeMin.toFixed(1)} min (${withoutChargePct.toFixed(1)}%)<br/>With DWPT: predicted station charging time ${withChargeMin.toFixed(1)} min (${withChargePct.toFixed(1)}%)<br/>DWPT used on route: ${dwptUsedKm.toFixed(1)} km<br/>Standby charging time saved: ${savedMin.toFixed(1)} min</div>`;
        }

        destinationSummaryInfo = new google.maps.InfoWindow({
          content,
          position: path[path.length - 1],
        });
        destinationSummaryInfo.open({ map });
      }

      function initBatteryInput() {
        const input = document.getElementById("batteryInput");
        if (!input) return;
        input.addEventListener("change", () => {
          const v = parseFloat(input.value);
          if (!isNaN(v) && v >= 1 && v <= 100) {
            batteryLevel = v / 100.0;
            document.getElementById("battery").innerText = `${Math.round(v)}%`;
          }
        });
      }

      /* ---------------------
   PLAN ROUTE (BACKEND)
---------------------*/
      async function planRoute() {
        if (!sourceCoord || !destCoord) return;

        const dwptInput = document.getElementById("dwptInput");
        const dwptRaw = dwptInput ? parseFloat(dwptInput.value) : NaN;
        const dwpt_km = (!isNaN(dwptRaw) && dwptRaw >= 0) ? dwptRaw : 0.0;

        const payload = {
          src_lat: sourceCoord.lat,
          src_lon: sourceCoord.lng,
          dst_lat: destCoord.lat,
          dst_lon: destCoord.lng,
          src_name: sourceNameText,
          dst_name: destNameText,
          current_soc: batteryLevel,
          temp_c: weatherSnapshot ? weatherSnapshot.temp_c : null,
          wind_kmh: weatherSnapshot ? weatherSnapshot.wind_kmh : null,
          dwpt_km: dwpt_km,
        };

        try {
          const res = await fetch("/api/route", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(payload),
          });
          if (!res.ok) return;
          const data = await res.json();
          if (data && data.ok === false) {
            alert(data.reason || "Route planning failed.");
            return;
          }
          renderRouteFromJson(data);
        } catch (e) {
          console.warn("Route request failed.", e);
        }
      }

      /* ---------------------
   START
---------------------*/
      initMap();
    </script>
  </body>
</html>
